{% extends 'base.html' %}

{% block title %}Eliminar Producto{% endblock %}

{% block content %}
<h2>¿Estás seguro de que deseas eliminar el producto "{{ producto.nombre }}"?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar eliminación</button>
    <a href="{% url 'producto_lista' %}">Cancelar</a>
</form>
{% endblock %}
