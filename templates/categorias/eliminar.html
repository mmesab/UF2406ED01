{% extends 'base.html' %}

{% block title %}Eliminar Categoría{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Eliminar Categoría</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">¿Estás seguro de que deseas eliminar la categoría <strong>"{{ categoria.nombre }}"</strong>?</p>
                <p class="text-muted small">Atención: Esta acción no se puede deshacer.</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'categoria_lista' %}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
